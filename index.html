<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- SVG for modern browsers, sized PNGs for fallback, apple-touch-icon for iOS -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16.png"
    />
    <!-- Google wants a search favicon larger than 48px; it does not read
         site.webmanifest, so the 192px icon has to be declared here too. -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/icon-192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Erratic Maps: Free Map Poster & Wallpaper Creator</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Free online map poster and wallpaper generator. Design custom, print-ready map art for any city or location — export as PNG, PDF, or SVG. No sign-up required."
    />
    <meta
      name="keywords"
      content="free map poster creator, free map poster generator, map wallpaper creator, map wallpaper generator, map poster maker, custom map art, map wall art, city map poster, print map poster, map art generator, OpenStreetMap poster, free map print, erratic maps"
    />
    <meta name="robots" content="index, follow" />
    <meta
      name="google-site-verification"
      content="%VITE_GOOGLE_SITE_VERIFICATION%"
    />
    <meta name="author" content="Erratic Maps" />
    <meta name="copyright" content="Erratic Maps" />
    <link rel="canonical" href="https://maps.erraticl.uk" />
    <!-- Plain-text site summary for AI agents (llmstxt.org) -->
    <link rel="describedby" type="text/markdown" href="/llms.txt" />

    <!-- Theme colour -->
    <meta name="theme-color" content="#0a1824" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Erratic Maps" />
    <meta name="msapplication-TileColor" content="#0a1824" />
    <link rel="mask-icon" href="/assets/logo.svg" color="#0a1824" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Erratic Maps" />
    <meta
      property="og:title"
      content="Erratic Maps: Free Map Poster & Wallpaper Creator"
    />
    <meta
      property="og:description"
      content="Free online map poster and wallpaper generator. Design custom, print-ready map art for any city or location — export as PNG, PDF, or SVG. No sign-up required."
    />
    <meta property="og:url" content="https://maps.erraticl.uk" />
    <meta
      property="og:image"
      content="https://maps.erraticl.uk/assets/banner.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Erratic Maps — free map poster and wallpaper creator"
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Erratic Maps: Free Map Poster & Wallpaper Creator"
    />
    <meta
      name="twitter:description"
      content="Free online map poster and wallpaper generator. Design custom, print-ready map art for any city or location — export as PNG, PDF, or SVG. No sign-up required."
    />
    <meta
      name="twitter:image"
      content="https://maps.erraticl.uk/assets/banner.png"
    />
    <meta
      name="twitter:image:alt"
      content="Erratic Maps — free map poster and wallpaper creator"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://maps.erraticl.uk/#organization",
            "name": "Erratic Maps",
            "url": "https://maps.erraticl.uk",
            "logo": {
              "@type": "ImageObject",
              "url": "https://maps.erraticl.uk/assets/icon-512.png",
              "width": 512,
              "height": 512
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://maps.erraticl.uk/#webapp",
            "name": "Erratic Maps",
            "alternateName": [
              "Erratic Maps Poster Creator",
              "Erratic Maps Wallpaper Generator"
            ],
            "url": "https://maps.erraticl.uk",
            "description": "Free online map poster and wallpaper generator. Design custom, print-ready map art for any city or location — export as PNG, PDF, or SVG. No sign-up required.",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires a modern web browser",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "screenshot": "https://maps.erraticl.uk/assets/banner.png",
            "featureList": [
              "Free map poster creator for any city or location",
              "Map wallpaper generator with custom styles",
              "High-resolution PNG, PDF, and SVG export",
              "Powered by OpenStreetMap data",
              "Dozens of curated map themes",
              "Custom colour palettes",
              "Typography controls with self-hosted typefaces",
              "No sign-up or account required",
              "Works entirely in your browser"
            ],
            "keywords": "free map poster creator, map wallpaper generator, map poster maker, custom map art, city map print",
            "creator": { "@id": "https://maps.erraticl.uk/#organization" }
          }
        ]
      }
    </script>

    <!-- Erratic Maps runs no analytics and no ads. The upstream GA4 and
         Consent Mode scripts are removed, not just unconfigured, so the
         browser makes no request to Google at all. -->

    <!-- Mediavine ad script — injected by the ads plugin when
         VITE_MEDIAVINE_SITE_ID is set. It is not set for Erratic Maps. -->
    <!-- mediavine-script -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
