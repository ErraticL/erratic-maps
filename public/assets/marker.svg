<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Erratic Maps logo">
  <!-- Interim Erratic Maps mark: a faceted glacial-erratic boulder that
       rests above a strata line. Replaces the upstream Terraink logo. -->
  <g stroke="#0a1824" stroke-width="6" stroke-linejoin="round">
    <polygon points="116,150 256,72 230,238" fill="#f7d074" />
    <polygon points="256,72 402,150 324,272 230,238" fill="#eeb94c" />
    <polygon points="402,150 440,306 324,272" fill="#d99a2b" />
    <polygon points="440,306 338,432 324,272" fill="#b97f22" />
    <polygon points="338,432 160,436 230,238 324,272" fill="#a06a1c" />
    <polygon points="160,436 76,300 230,238" fill="#c28a24" />
    <polygon points="76,300 116,150 230,238" fill="#e0a83c" />
  </g>
  <rect x="110" y="466" width="292" height="16" rx="8" fill="#4d7ea8" />
  <rect x="170" y="494" width="172" height="12" rx="6" fill="#35608a" />
</svg>
